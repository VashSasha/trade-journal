<section class="dashboard-widget-frame" [class.dashboard-widget-frame--editing]="layout.editing()">
    @if (layout.editing()) {
        <header class="dashboard-widget-frame__toolbar">
            <button type="button" class="dashboard-widget-frame__drag-handle"
                [attr.aria-label]="'Drag ' + label()" [title]="'Drag ' + label()">
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <circle cx="6" cy="5" r="1.2"/><circle cx="14" cy="5" r="1.2"/>
                    <circle cx="6" cy="10" r="1.2"/><circle cx="14" cy="10" r="1.2"/>
                    <circle cx="6" cy="15" r="1.2"/><circle cx="14" cy="15" r="1.2"/>
                </svg>
                <span>{{ label() }}</span>
            </button>
            <button type="button" class="dashboard-widget-frame__hide" (click)="hide()"
                [attr.aria-label]="'Hide ' + label()">Hide</button>
        </header>
    }
    <div class="dashboard-widget-frame__body">
        <div class="dashboard-widget-frame__content">
            <ng-content />
        </div>
    </div>
</section>
