<section class="filter-toolbar" aria-label="Performance filters" [class.filter-toolbar--expanded]="mobileFiltersOpen()">
    <div class="filter-toolbar__mobile">
        <select #mobileDate aria-label="Performance date range" [value]="showCustomDatePicker() ? 'custom' : activeDateFilter()"
            (change)="selectMobileDate($any($event.target).value)">
            <option value="all">All time</option>
            <option value="today">Today</option>
            <option value="week">This week</option>
            <option value="month">This month</option>
            <option value="custom">Custom dates</option>
        </select>
        <button type="button" [attr.aria-expanded]="mobileFiltersOpen()" aria-controls="dashboard-side-filters"
            (click)="toggleMobileFilters()">
            Filters @if (filterService.filters().sides.length) { <span>{{ filterService.filters().sides.length }}</span> }
        </button>
    </div>

    <div class="filter-toolbar__presets" role="group" aria-label="Date range">
        @for (preset of datePresets; track preset.value) {
            <button type="button" class="filter-preset" (click)="setDateFilter(preset.value)"
                [attr.aria-pressed]="activeDateFilter() === preset.value"
                [class.filter-preset--active]="activeDateFilter() === preset.value">
                {{ preset.label }}
            </button>
        }
        <button #customTrigger type="button" class="filter-preset" (click)="toggleCustomDatePicker()"
            [attr.aria-expanded]="showCustomDatePicker()" aria-controls="performance-custom-dates"
            [class.filter-preset--active]="activeDateFilter() === 'custom'">
            Custom dates
        </button>
    </div>

    <div class="filter-toolbar__sides" id="dashboard-side-filters" role="group" aria-label="Trade direction">
        <span class="filter-toolbar__label">Direction</span>
        <button type="button" class="filter-side-btn" (click)="filterService.toggleSide('long')"
            [attr.aria-pressed]="filterService.filters().sides.includes('long')"
            [class.filter-side-btn--long-active]="filterService.filters().sides.includes('long')">Long</button>
        <button type="button" class="filter-side-btn" (click)="filterService.toggleSide('short')"
            [attr.aria-pressed]="filterService.filters().sides.includes('short')"
            [class.filter-side-btn--short-active]="filterService.filters().sides.includes('short')">Short</button>
    </div>

    <button type="button" class="filter-toolbar__reset" (click)="reset()">Reset</button>

    @if (showCustomDatePicker()) {
        <div class="filter-dates" id="performance-custom-dates" role="group" aria-label="Custom date range">
            <div class="filter-dates__field">
                <label for="performance-start">Start date</label>
                <input id="performance-start" type="date" [(ngModel)]="customStartDate"
                    [max]="customEndDate()" [attr.aria-invalid]="dateRangeError() ? 'true' : null"
                    [attr.aria-describedby]="dateRangeError() ? 'performance-date-error' : null" />
            </div>
            <div class="filter-dates__field">
                <label for="performance-end">End date</label>
                <input id="performance-end" type="date" [(ngModel)]="customEndDate"
                    [min]="customStartDate()" [attr.aria-invalid]="dateRangeError() ? 'true' : null"
                    [attr.aria-describedby]="dateRangeError() ? 'performance-date-error' : null" />
            </div>
            <div class="filter-dates__actions">
                <button type="button" class="filter-dates__apply" [disabled]="!canApplyCustomRange()"
                    (click)="applyCustomDateRange()">Apply dates</button>
                <button type="button" (click)="closeCustomDatePicker()">Cancel</button>
            </div>
            @if (dateRangeError(); as error) { <p id="performance-date-error" role="alert">{{ error }}</p> }
        </div>
    } @else if (activeDateFilter() === 'custom') {
        <button type="button" class="filter-toolbar__summary" (click)="toggleCustomDatePicker()"
            aria-controls="performance-custom-dates" aria-expanded="false">
            {{ customRangeLabel() }} <span>Edit dates</span>
        </button>
    }
</section>
