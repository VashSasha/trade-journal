<div class="stats-overview">
  <!-- Total P&L -->
  <div class="stat-card" [class.stat-card--positive]="stats.totalPnl > 0" [class.stat-card--negative]="stats.totalPnl < 0">
    <div class="stat-card__body">
      <div class="stat-card__label">Total P&L</div>
      <div class="stat-card__value">{{ stats.totalPnl | currency }}</div>
      <div class="stat-card__sub">
        {{ stats.totalPoints >= 0 ? '+' : '' }}{{ stats.totalPoints.toFixed(2) }} points
      </div>
    </div>
    <button type="button" class="stat-card__share-btn" (click)="openShare()" aria-label="Share P&L">
      <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
      </svg>
    </button>
  </div>

  <!-- Win Rate -->
  <div class="stat-card">
    <div class="stat-card__body">
      <div class="stat-card__label">Win rate</div>
      <div class="stat-card__value">{{ stats.winRate.toFixed(1) }}%</div>
    </div>
  </div>

  <!-- Total Trades -->
  <div class="stat-card">
    <div class="stat-card__body">
      <div class="stat-card__label">Total trades</div>
      <div class="stat-card__value">{{ stats.totalTrades }}</div>
      <div class="stat-card__sub">{{ stats.openTrades }} open</div>
    </div>
  </div>

  <!-- Best Trade -->
  <div class="stat-card stat-card--positive">
    <div class="stat-card__body">
      <div class="stat-card__label">Best trade</div>
      <div class="stat-card__value">{{ stats.largestWin | currency }}</div>
    </div>
  </div>
</div>

<app-share-pnl
  [pnl]="stats.totalPnl"
  [stats]="sharePnlStats"
  [dateLabel]="sharePnlDateLabel"
  context="dashboard">
</app-share-pnl>
