<div class="perf-charts">
    <!-- Equity Curve -->
    <div class="perf-charts__card">
        <h3 class="perf-charts__title">Equity Curve</h3>
        <div class="perf-charts__canvas-wrap">
            <app-equity-curve-chart
                [equityData]="equityData"
                [baseline]="accountSettings.startingBalance()">
            </app-equity-curve-chart>
        </div>
    </div>

    <!-- Win/Loss Distribution -->
    <div class="perf-charts__card">
        <h3 class="perf-charts__title">Win/Loss Distribution</h3>
        <div class="perf-charts__canvas-wrap">
            <canvas #winLossChart></canvas>
        </div>
    </div>
</div>
