<section class="audience">
    <div class="audience__inner">
        <div class="audience__head" appRevealOnScroll>
            <h2 class="audience__title">The AI coach that meets you where you are</h2>
        </div>

        <div class="audience__grid">
            @for (card of cards; track card.title) {
                <article class="audience-card" appRevealOnScroll>
                    <span class="audience-card__icon">{{ card.icon }}</span>
                    <h3 class="audience-card__title">{{ card.title }}</h3>
                    <p class="audience-card__text">{{ card.text }}</p>
                </article>
            }
        </div>
    </div>
</section>
