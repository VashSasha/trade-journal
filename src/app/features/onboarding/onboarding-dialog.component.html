<dialog #dialog class="setup-dialog" aria-labelledby="setup-dialog-title"
    (cancel)="setup.closeGuide()" (close)="onClosed()" (click)="closeBackdrop($event)">
    <div class="setup-dialog__content">
        <header class="setup-dialog__header">
            <h2 id="setup-dialog-title">Getting started</h2>
            <button type="button" class="setup-dialog__close" aria-label="Close getting started" (click)="setup.closeGuide()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
        </header>
        @if (setup.dialogOpen()) {
            <div class="setup-dialog__body" (click)="followLink($event)"><app-getting-started [embedded]="true" /></div>
        }
        <footer class="setup-dialog__footer">
            <button type="button" (click)="exploreDemo()">Explore demo instead</button>
            <button type="button" (click)="setup.closeGuide()">{{ setup.complete() ? 'Done' : 'I’ll come back later' }}</button>
        </footer>
    </div>
</dialog>
