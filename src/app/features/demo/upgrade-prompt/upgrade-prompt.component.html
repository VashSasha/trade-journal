@if (visible() && copy(); as c) {
<div class="up-backdrop" (click)="dismiss()">
    <div class="up" (click)="$event.stopPropagation()" role="dialog" aria-labelledby="up-title">
        <div class="up__icon-wrap" aria-hidden="true">
            <svg class="up__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
        </div>

        <h2 class="up__title" id="up-title">{{ c.title }}</h2>
        <p class="up__body">{{ c.body }}</p>

        <div class="up__actions">
            @if (canSwitch()) {
            <button class="up__btn up__btn--primary" type="button" (click)="switchWorkspace()" [disabled]="demo.transitioning()">
                Switch to my workspace
            </button>
            } @else if (isSignedIn()) {
            <a class="up__btn up__btn--primary" routerLink="/account/plan" (click)="dismiss()">
                View subscription options
            </a>
            } @else {
            <a class="up__btn up__btn--primary" routerLink="/login" (click)="dismiss()">
                Create an account
            </a>
            }

            <a class="up__btn up__btn--secondary" [href]="whopUrl" target="_blank" rel="noopener" (click)="dismiss()">
                Join NVZN Trading
            </a>

            <button class="up__skip" type="button" (click)="dismiss()">{{ demo.active() ? 'Stay in demo' : 'Not now' }}</button>
        </div>
    </div>
</div>
}
