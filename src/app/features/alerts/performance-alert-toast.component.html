@if (alerts.current(); as event) {
    <aside class="performance-toast performance-toast--{{ event.tone }}" [attr.role]="event.tone === 'risk' || event.tone === 'warning' ? 'alert' : 'status'">
        <span class="performance-toast__mark" aria-hidden="true">{{ event.tone === 'risk' || event.tone === 'warning' ? '!' : event.tone === 'target' ? '✓' : 'i' }}</span>
        <div class="performance-toast__copy">
            <strong>{{ event.title }}</strong>
            <span>{{ event.text }}</span>
        </div>
        <button type="button" (click)="alerts.dismiss()" aria-label="Dismiss alert">×</button>
    </aside>
}
