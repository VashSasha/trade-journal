<div class="journal-layout">
    <div class="journal-container">
        <header class="journal-heading">
            <h1>Journal</h1>
            <p>Prepare, review, and build on each trading day.</p>
        </header>
        <nav class="journal-tabs" aria-label="Journal views">
            <a routerLink="daily" routerLinkActive="active" ariaCurrentWhenActive="page" class="journal-tab">
                Daily journal
            </a>
            <a routerLink="trades" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" class="journal-tab">
                Trade notes
            </a>
        </nav>

        <div class="journal-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
