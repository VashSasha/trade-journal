<section class="alerts-settings">
    <header class="alerts-settings__header">
        <h2 class="alerts-settings__title">Alerts</h2>
        <p class="alerts-settings__description">Stay aware with session bells, live position coaching, economic-event warnings, and your own trading limits.</p>
    </header>

    <div class="alerts-settings__card">
        <div class="alerts-settings__card-head">
            <div>
                <h3>Sound</h3>
                <p>One account-synced master volume for every audible alert. Each browser still requires one activation click.</p>
            </div>
            <span class="alerts-settings__badge">Account synced</span>
        </div>
        <app-session-alert-controls section="master" [expanded]="true" [settingsView]="true" />
        <app-custom-alert-sound-controls />
    </div>

    <app-session-schedule-controls />

    <app-live-coach-controls />

    <app-market-event-alert-controls />

    <app-performance-alert-controls />
</section>
