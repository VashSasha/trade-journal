<section class="alerts-settings">
    <header class="alerts-settings__header">
        <h2 class="alerts-settings__title">Alerts</h2>
        <p class="alerts-settings__description">Choose what you hear and when.</p>
    </header>

    <div class="alerts-settings__card alerts-settings__card--sounds">
        <div class="alerts-settings__card-head">
            <div>
                <h3>Sound</h3>
            </div>
        </div>
        <app-session-alert-controls section="master" [expanded]="true" [settingsView]="true" />
        <app-custom-alert-sound-controls />
    </div>

    <app-session-schedule-controls />

    <app-market-event-alert-controls />

    <app-performance-alert-controls />
    <a class="alerts-settings__coach-link" routerLink="/account/ai">AI voice &amp; coaching settings <span aria-hidden="true">↗</span></a>
</section>
